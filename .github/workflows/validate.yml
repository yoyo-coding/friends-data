name: Friend link validation

on:
  pull_request:
    paths:
      - "data/friends/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate & verify backlinks
        id: validate
        env:
          SITE_URL: "https://yoyo-coding.github.io/me"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node validate.mjs

      - name: Comment on failure
        if: failure() && github.event_name == 'pull_request'
        run: echo "校验失败，原因见上方日志与 PR 评论"

  merge:
    needs: validate
    if: needs.validate.outputs.valid == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --repo "${{ github.repository }}" || gh pr merge "${{ github.event.pull_request.number }}" --merge --repo "${{ github.repository }}" || true
